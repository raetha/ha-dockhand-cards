name: CI

on:
  push:
    branches: [main]
  pull_request:

# Restrict all jobs to read-only by default; no job in this workflow
# writes back to the repository or creates releases.
permissions:
  contents: read

jobs:
  # ── HACS plugin (dashboard) validation ─────────────────────────────────
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: plugin

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run verify
